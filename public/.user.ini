; رفع حدود الرفع كي تُقبَل ملفّات الوسائط الكبيرة (فيديو الأنشطة حتى 500MB) بدل إسقاطها بصمت.
; يقرؤها PHP-FPM/LiteSpeed (بيئة Hostinger) من مجلّد السكربت (public/). قد يتأخّر السريان حتى
; 5 دقائق (user_ini.cache_ttl). post_max_size أكبر قليلاً من upload_max_filesize لهامش ترويسة POST.
upload_max_filesize = 500M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
