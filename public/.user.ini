; رفع حدود الرفع كي تُقبَل ملفّات الوسائط الكبيرة (فيديو الأنشطة حتى 100MB) بدل إسقاطها بصمت.
; يقرؤها PHP-FPM/LiteSpeed (بيئة Hostinger) من مجلّد السكربت (public/). قد يتأخّر السريان حتى
; 5 دقائق (user_ini.cache_ttl). القيمة أكبر من سقف التحقّق (max:102400KB=100MB) لهامش ترويسة POST.
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
